<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>IMU Daten - Graphen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #222; color: #fff; text-align: center; padding: 20px; }
        .chart-container { width: 90%; max-width: 1000px; margin: 20px auto; background: #333; padding: 15px; border-radius: 10px; }
        h1 { color: #4caf50; }
        h2 { font-size: 18px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>Echtzeit-Graphen: Kalman vs. Komplementär vs. BNO055</h1>

    <div class="chart-container">
        <h2>Roll (X-Achse)</h2>
        <canvas id="chartRoll"></canvas>
    </div>
    <div class="chart-container">
        <h2>Pitch (Y-Achse)</h2>
        <canvas id="chartPitch"></canvas>
    </div>
    <div class="chart-container">
        <h2>Yaw (Z-Achse)</h2>
        <canvas id="chartYaw"></canvas>
    </div>

    <script>
        const socket = io();

        // Globale Variablen für die aktuellen Werte
        let currentData = {
            kalman: { r: 0, p: 0, y: 0 },
            komp: { r: 0, p: 0, y: 0 },
            bno: { r: 0, p: 0, y: 0 }
        };

        // Socket Events einlesen (nur Werte aktualisieren)
        socket.on('sensor_data_kalman', data => {
            currentData.kalman.r = data.roll_kalman;
            currentData.kalman.p = data.pitch_kalman;
            currentData.kalman.y = data.yaw_kalman;
        });
        socket.on('sensor_data_komp', data => {
            currentData.komp.r = data.Roll;
            currentData.komp.p = data.Pitch;
            currentData.komp.y = data.Yaw;
        });
        socket.on('sensor_data_bno055', data => {
            currentData.bno.r = data.Roll_B;
            currentData.bno.p = data.Pitch_B;
            currentData.bno.y = data.Yaw_B;
        });

        // Chart.js Setup Funktion
        const maxDataPoints = 100;
        function createChart(canvasId, title) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(maxDataPoints).fill(''),
                    datasets: [
                        { label: 'Kalman', borderColor: '#4caf50', data: Array(maxDataPoints).fill(0), pointRadius: 0, tension: 0.1, borderWidth: 2 },
                        { label: 'Komplementär', borderColor: '#ff9800', data: Array(maxDataPoints).fill(0), pointRadius: 0, tension: 0.1, borderWidth: 2 },
                        { label: 'BNO055', borderColor: '#2196f3', data: Array(maxDataPoints).fill(0), pointRadius: 0, tension: 0.1, borderWidth: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    animation: false,
                    scales: {
                        y: { min: -180, max: 180, grid: { color: '#555' } },
                        x: { display: false }
                    },
                    plugins: { legend: { labels: { color: '#fff' } } }
                }
            });
        }

        // Charts initialisieren
        const chartRoll = createChart('chartRoll', 'Roll');
        const chartPitch = createChart('chartPitch', 'Pitch');
        const chartYaw = createChart('chartYaw', 'Yaw');

        // Charts mit 20 Hz aktualisieren (verhindert Browser-Absturz)
        setInterval(() => {
            // Roll Update
            chartRoll.data.datasets[0].data.shift(); chartRoll.data.datasets[0].data.push(currentData.kalman.r);
            chartRoll.data.datasets[1].data.shift(); chartRoll.data.datasets[1].data.push(currentData.komp.r);
            chartRoll.data.datasets[2].data.shift(); chartRoll.data.datasets[2].data.push(currentData.bno.r);
            chartRoll.update();

            // Pitch Update
            chartPitch.data.datasets[0].data.shift(); chartPitch.data.datasets[0].data.push(currentData.kalman.p);
            chartPitch.data.datasets[1].data.shift(); chartPitch.data.datasets[1].data.push(currentData.komp.p);
            chartPitch.data.datasets[2].data.shift(); chartPitch.data.datasets[2].data.push(currentData.bno.p);
            chartPitch.update();

            // Yaw Update
            chartYaw.data.datasets[0].data.shift(); chartYaw.data.datasets[0].data.push(currentData.kalman.y);
            chartYaw.data.datasets[1].data.shift(); chartYaw.data.datasets[1].data.push(currentData.komp.y);
            chartYaw.data.datasets[2].data.shift(); chartYaw.data.datasets[2].data.push(currentData.bno.y);
            chartYaw.update();
        }, 50);
    </script>
</body>
</html>
